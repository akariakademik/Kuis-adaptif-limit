<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Data - Kuis Limit Fungsi</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            z-index: 999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-weight: bold;
            color: var(--primary);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container" style="text-align: center;">
    <h2>Isi Data Diri</h2>
    <p style="color: var(--text-muted); margin-bottom: 25px;">Mohon lengkapi data berikut sebelum memulai kuis persiapan UTBK/SNBT.</p>

    <form id="registration-form" onsubmit="submitData(event)">
        
        <div class="form-group">
            <label for="nama">Nama Lengkap *</label>
            <input type="text" id="nama" class="form-control" required placeholder="Masukkan nama lengkap Anda">
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" required placeholder="email@contoh.com">
        </div>

        <div class="form-group">
            <label for="sekolah">Asal Sekolah *</label>
            <input type="text" id="sekolah" class="form-control" required placeholder="Misal: SMAN 1 Surabaya">
        </div>

        <div class="form-group">
            <label for="bimbel">Sudah pernah bimbel dimana? *</label>
            <input type="text" id="bimbel" class="form-control" required placeholder="Misal: Belum pernah / Nama Bimbel">
        </div>

        <button type="submit" class="btn-main" id="btn-submit">Simpan & Lanjutkan ke Kuis</button>
    </form>
</div>

<!-- Animasi Loading saat mengirim data -->
<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    Menyimpan data Anda...
</div>

<script>
    async function submitData(event) {
        event.preventDefault(); // Mencegah form melakukan refresh halaman

        // PASTE URL APPS SCRIPT ANDA DI BAWAH INI (Gantikan teksnya)
        const scriptURL = https://script.google.com/macros/s/AKfycbyvjm5UiRendSAUYmrrF1tjVEPh0isAf4XhTl0NnkCSIxaEgegsOick5sJz7d_iaA_hfw/exec; 

        // Tampilkan loading screen
        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('btn-submit').disabled = true;

        // Ambil nilai dari form
        const formData = {
            nama: document.getElementById('nama').value,
            email: document.getElementById('email').value,
            sekolah: document.getElementById('sekolah').value,
            bimbel: document.getElementById('bimbel').value
        };

        try {
            const response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(formData),
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                }
            });

            const result = await response.json();

            if (result.result === 'success') {
                // Simpan nama di sessionStorage agar bisa dipanggil di halaman berikutnya jika perlu
                sessionStorage.setItem('studentName', formData.nama);
                
                // Redirect ke halaman awal kuis
                window.location.href = 'index.html';
            } else {
                alert('Terjadi kesalahan saat menyimpan data: ' + result.message);
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('btn-submit').disabled = false;
            }
        } catch (error) {
            console.error('Error!', error.message);
            alert('Gagal terhubung ke server. Pastikan koneksi internet Anda stabil.');
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('btn-submit').disabled = false;
        }
    }
</script>

</body>
</html>
